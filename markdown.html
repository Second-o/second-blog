<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 编辑器 · 实时预览</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0e1014; --panel:#151922; --panel2:#1a1f2b; --border:#252b38;
  --text:#e7eaf0; --muted:#8d97a8; --accent:#6f9cff; --accent-soft:rgba(111,156,255,.14);
  --ok:#3ddc97;
}
[data-theme="light"]{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f4f6f9; --border:#e0e5ec;
  --text:#1e2430; --muted:#6a7482; --accent:#2f6df6; --accent-soft:rgba(47,109,246,.1);
  --ok:#12a06a;
}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.app{height:100vh;display:flex;flex-direction:column}

/* ---------- 顶栏 ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:0 1 auto}
.logo{
  width:28px;height:28px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),#a06bff);
  color:#fff;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;
  letter-spacing:-.5px;
}
.doc-title{
  font:inherit;font-size:14px;font-weight:600;
  background:transparent;border:1px solid transparent;border-radius:7px;
  color:var(--text);padding:5px 8px;min-width:120px;max-width:280px;width:22vw;
  outline:none;
}
.doc-title:hover{border-color:var(--border)}
.doc-title:focus{border-color:var(--accent);background:var(--panel2)}
.actions{display:flex;align-items:center;gap:7px;margin-left:auto;flex-wrap:wrap}
.btn{
  font:inherit;font-size:13px;line-height:1;
  background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:8px;
  padding:7px 11px;cursor:pointer;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s,transform .08s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn.back{flex:0 0 auto}
.seg{display:flex;background:var(--panel2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{
  font:inherit;font-size:13px;line-height:1;background:transparent;color:var(--muted);
  border:0;padding:7px 11px;cursor:pointer;transition:background .15s,color .15s;
}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* ---------- 工具栏 ---------- */
.toolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:3px;
  padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
}
.toolbar::-webkit-scrollbar{display:none}
.toolbar button{
  font:inherit;font-size:12.5px;line-height:1;
  background:transparent;color:var(--muted);
  border:1px solid transparent;border-radius:7px;
  padding:6px 9px;cursor:pointer;white-space:nowrap;
  transition:background .12s,color .12s;
}
.toolbar button:hover{background:var(--panel2);color:var(--accent)}
.toolbar button:active{background:var(--accent-soft)}
.toolbar b,.toolbar i,.toolbar s{font-size:13px}
.toolbar .sep{width:1px;height:16px;background:var(--border);margin:0 5px;flex:0 0 auto}
.toolbar .grow{flex:1 1 auto}

/* ---------- 工作区 ---------- */
.workspace{flex:1 1 auto;display:flex;min-height:0;background:var(--bg)}
.pane{flex:1 1 0;min-width:0;display:flex;overflow:hidden}
.pane-edit{background:var(--panel)}
#editor{
  flex:1 1 auto;width:100%;height:100%;
  border:0;outline:none;resize:none;
  background:transparent;color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
  font-size:14px;line-height:1.72;letter-spacing:.1px;
  padding:20px 22px;tab-size:2;white-space:pre-wrap;overflow-wrap:break-word;
}
#editor::placeholder{color:var(--muted);opacity:.7}
.splitter{
  flex:0 0 5px;cursor:col-resize;background:var(--border);
  transition:background .15s;
}
.splitter:hover,.splitter:active{background:var(--accent)}
.pane-preview{overflow-y:auto;background:var(--panel);border-left:0}
.pane-preview::-webkit-scrollbar,.pane-edit textarea::-webkit-scrollbar{width:10px}
.pane-preview::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:3px solid var(--panel)}

[data-view="edit"] .pane-preview,[data-view="edit"] .splitter{display:none}
[data-view="preview"] .pane-edit,[data-view="preview"] .splitter{display:none}
[data-view="preview"] .pane-preview{border-left:0}

/* ---------- 状态栏 ---------- */
.statusbar{
  flex:0 0 auto;display:flex;align-items:center;gap:16px;
  padding:6px 16px;background:var(--panel);border-top:1px solid var(--border);
  font-size:12px;color:var(--muted);
}
.statusbar .grow{flex:1 1 auto}
#statSave{transition:color .2s}
#statSave.ok{color:var(--ok)}

/* ---------- 拖拽遮罩 ---------- */
.drop-mask{
  position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;
  background:rgba(10,14,22,.72);backdrop-filter:blur(3px);
  font-size:16px;font-weight:600;color:#fff;
}
.drop-mask.show{display:flex}
.drop-mask div{
  border:2px dashed rgba(255,255,255,.5);border-radius:16px;
  padding:34px 52px;background:rgba(255,255,255,.06);
}

@media (max-width:760px){
  .doc-title{width:34vw}
  .actions{gap:5px}
  .btn,.seg button{padding:6px 8px;font-size:12px}
  .workspace{flex-direction:column}
  .pane-edit,.pane-preview{flex:1 1 50%}
  .splitter{display:none}
  [data-view="split"] .pane-edit{border-bottom:1px solid var(--border)}
  [data-view="split"] .pane-preview{border-left:0}
}
</style>

<!-- 预览样式：导出 HTML 时会被一并写入 -->
<style id="preview-style">
.markdown-body{
  padding:26px 34px 90px;font-size:15.5px;line-height:1.78;
  word-wrap:break-word;max-width:860px;margin:0 auto;
}
.markdown-body > *:first-child{margin-top:0}
.markdown-body h1,.markdown-body h2,.markdown-body h3,
.markdown-body h4,.markdown-body h5,.markdown-body h6{
  line-height:1.35;margin:1.7em 0 .7em;font-weight:650;letter-spacing:-.01em;
  scroll-margin-top:20px;
}
.markdown-body h1{font-size:1.85em;padding-bottom:.35em;border-bottom:1px solid currentColor;border-color:rgba(128,140,160,.28)}
.markdown-body h2{font-size:1.45em;padding-bottom:.3em;border-bottom:1px solid rgba(128,140,160,.24)}
.markdown-body h3{font-size:1.2em}
.markdown-body h4{font-size:1.05em}
.markdown-body h5,.markdown-body h6{font-size:.95em;color:#7b8698}
.markdown-body p{margin:0 0 1em}
.markdown-body a{color:#6f9cff;text-decoration:none;border-bottom:1px solid rgba(111,156,255,.35)}
.markdown-body a:hover{border-bottom-color:#6f9cff}
.markdown-body strong{font-weight:680}
.markdown-body del{opacity:.6}
.markdown-body hr{
  height:1px;border:0;margin:2em 0;
  background:rgba(128,140,160,.28);
}
.markdown-body ul,.markdown-body ol{margin:0 0 1em;padding-left:1.6em}
.markdown-body li{margin:.3em 0}
.markdown-body li > ul,.markdown-body li > ol{margin:.3em 0}
.markdown-body ul{list-style:disc}
.markdown-body ul ul{list-style:circle}
.markdown-body ol{list-style:decimal}
.markdown-body li.md-task{list-style:none;margin-left:-1.45em}
.markdown-body li.md-task input{margin-right:.5em;vertical-align:middle;accent-color:#6f9cff}
.markdown-body blockquote{
  margin:0 0 1em;padding:.55em 1.1em;
  border-left:3px solid #6f9cff;
  background:rgba(111,156,255,.07);
  border-radius:0 8px 8px 0;
  color:#93a2b8;
}
.markdown-body blockquote p:last-child{margin-bottom:0}
.markdown-body blockquote blockquote{margin-top:.6em}
.markdown-body code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:.88em;padding:.16em .42em;border-radius:5px;
  background:rgba(128,140,160,.16);
  border:1px solid rgba(128,140,160,.14);
}
.markdown-body pre{
  margin:0 0 1.2em;padding:15px 18px;overflow-x:auto;
  background:#12161f;border:1px solid rgba(128,140,160,.18);
  border-radius:12px;line-height:1.6;
}
.markdown-body pre code{
  padding:0;border:0;background:none;font-size:.86em;color:#d8e0ee;
  white-space:pre;
}
.markdown-body .md-table-wrap{
  margin:0 0 1.2em;overflow-x:auto;
  border:1px solid rgba(128,140,160,.24);border-radius:11px;
}
.markdown-body table{border-collapse:collapse;width:100%;font-size:.94em}
.markdown-body th,.markdown-body td{
  padding:9px 14px;text-align:left;
  border-bottom:1px solid rgba(128,140,160,.18);
  border-right:1px solid rgba(128,140,160,.12);
}
.markdown-body th:last-child,.markdown-body td:last-child{border-right:0}
.markdown-body tr:last-child td{border-bottom:0}
.markdown-body thead th{
  background:rgba(128,140,160,.12);font-weight:640;white-space:nowrap;
}
.markdown-body tbody tr:hover{background:rgba(128,140,160,.06)}
.markdown-body img{max-width:100%;height:auto;border-radius:10px;margin:.3em 0}
.markdown-body .md-empty{color:#8d97a8;font-style:normal}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <a href="tools.html" class="btn back" title="返回实用小工具">← 返回</a>
    <div class="brand">
      <span class="logo">M↓</span>
      <input id="docTitle" class="doc-title" value="未命名文档" spellcheck="false" aria-label="文档名称">
    </div>
    <div class="actions">
      <button id="btnImport" class="btn" title="从本地选择 .md 文件">导入</button>
      <input id="fileInput" type="file" accept=".md,.markdown,.txt,text/markdown" hidden>
      <button id="btnExportMd" class="btn" title="下载 Markdown 源文件">导出 .md</button>
      <button id="btnExportHtml" class="btn" title="下载带样式的 HTML">导出 .html</button>
      <button id="btnCopyHtml" class="btn" title="复制带样式的 HTML 到剪贴板">复制 HTML</button>
      <div class="seg" id="viewSeg">
        <button data-view="edit">编辑</button>
        <button data-view="split" class="on">分栏</button>
        <button data-view="preview">预览</button>
      </div>
      <button id="btnTheme" class="btn" title="切换深色 / 浅色">◐</button>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <button data-act="h1" title="一级标题">H1</button>
    <button data-act="h2" title="二级标题">H2</button>
    <button data-act="h3" title="三级标题">H3</button>
    <span class="sep"></span>
    <button data-act="bold" title="粗体（Ctrl+B）"><b>B</b></button>
    <button data-act="italic" title="斜体（Ctrl+I）"><i>I</i></button>
    <button data-act="strike" title="删除线"><s>S</s></button>
    <button data-act="code" title="行内代码">`code`</button>
    <span class="sep"></span>
    <button data-act="ul" title="无序列表">• 列表</button>
    <button data-act="ol" title="有序列表">1. 列表</button>
    <button data-act="task" title="任务列表">☑ 待办</button>
    <button data-act="quote" title="引用">❝ 引用</button>
    <span class="sep"></span>
    <button data-act="link" title="超链接（Ctrl+K）">链接</button>
    <button data-act="image" title="图片">图片</button>
    <button data-act="table" title="表格">表格</button>
    <button data-act="codeblock" title="代码块">代码块</button>
    <button data-act="hr" title="分割线">分割线</button>
    <span class="grow"></span>
    <button data-act="clear" title="清空当前内容">清空</button>
  </div>

  <main class="workspace" id="workspace" data-view="split">
    <section class="pane pane-edit">
      <textarea id="editor" spellcheck="false" placeholder="在此粘贴或拖入 Markdown 文本…"></textarea>
    </section>
    <div class="splitter" id="splitter" title="拖动调整宽度"></div>
    <section class="pane pane-preview">
      <article id="preview" class="markdown-body"></article>
    </section>
  </main>

  <footer class="statusbar">
    <span id="statSave">已就绪</span>
    <span class="grow"></span>
    <span id="statChars">0 字符</span>
    <span id="statWords">0 字</span>
    <span id="statLines">0 行</span>
    <span id="statRead">约 0 分钟</span>
  </footer>

</div>

<div class="drop-mask" id="dropMask"><div>松开鼠标导入 Markdown 文件</div></div>

<script>/* ==========================================================
   MiniMarkdown —— 零依赖的 Markdown 解析器
   ----------------------------------------------------------
   支持：标题、粗体、斜体、删除线、行内代码、围栏代码块、
        链接、图片、引用、有序/无序列表（可嵌套）、任务列表、
        表格（含对齐）、分割线、段落内换行、反斜杠转义。
   特点：不引入任何外部库，离线可用；默认转义 HTML，防止注入。
   ========================================================== */
;(function (global) {
  'use strict';

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function slug(s) {
    return String(s)
      .replace(/[*_`~]/g, '')
      .toLowerCase()
      .replace(/[^\w\u4e00-\u9fa5]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 60) || 'section';
  }

  /* ---------------- 行内解析 ---------------- */

  function parseInline(text) {
    var stash = [];
    function keep(html) {
      stash.push(html);
      return '\u0000' + (stash.length - 1) + '\u0000';
    }

    var t = String(text == null ? '' : text);

    // 1) 行内代码（最先，内部不再解析）
    t = t.replace(/(`+)([\s\S]*?)\1/g, function (m, ticks, code) {
      return keep('<code>' + escapeHtml(code.replace(/^ | $/g, '')) + '</code>');
    });

    // 2) 反斜杠转义
    t = t.replace(/\\([\\`*_{}\[\]()#+\-.!~>|])/g, function (m, ch) {
      return keep(escapeHtml(ch));
    });

    // URL 允许一层成对括号，如 javascript:alert(1)
    var URL_PART = '((?:[^()\\s<>]|\\([^()\\s]*\\))+)';

    // 3) 图片
    t = t.replace(new RegExp('!\\[([^\\]]*)\\]\\(\\s*<?' + URL_PART + '>?(?:\\s+["\']([^"\']*)["\'])?\\s*\\)', 'g'),
      function (m, alt, src, title) {
        return keep('<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(alt) + '"' +
          (title ? ' title="' + escapeHtml(title) + '"' : '') + '>');
      });

    // 4) 链接
    t = t.replace(new RegExp('\\[([^\\]]*)\\]\\(\\s*<?' + URL_PART + '>?(?:\\s+["\']([^"\']*)["\'])?\\s*\\)', 'g'),
      function (m, label, href, title) {
        var safe = /^(https?:\/\/|mailto:|#|\/|\.\/|\.\.\/)/i.test(href) ? href : '#';
        return keep('<a href="' + escapeHtml(safe) + '"' +
          (title ? ' title="' + escapeHtml(title) + '"' : '') +
          ' target="_blank" rel="noopener">' + escapeHtml(label) + '</a>');
      });

    // 5) 裸链接 <https://...>
    t = t.replace(/<(https?:\/\/[^\s>]+)>/g, function (m, url) {
      return keep('<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' +
        escapeHtml(url) + '</a>');
    });

    // 6) 其余文本转义
    t = escapeHtml(t);

    // 7) 粗体 / 斜体 / 删除线
    t = t.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/__([^_\n]+?)__/g, '<strong>$1</strong>');
    t = t.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
    t = t.replace(/~~([^~\n]+?)~~/g, '<del>$1</del>');

    // 8) 还原占位符
    t = t.replace(/\u0000(\d+)\u0000/g, function (m, i) {
      return stash[+i] !== undefined ? stash[+i] : '';
    });

    return t;
  }

  /* ---------------- 表格 ---------------- */

  function splitRow(row) {
    var s = String(row).trim().replace(/^\|/, '').replace(/\|$/, '');
    var cells = [], cur = '', inCode = false, i = 0;
    while (i < s.length) {
      var ch = s[i];
      if (ch === '\\' && s[i + 1] === '|') { cur += '|'; i += 2; continue; }
      if (ch === '`') { inCode = !inCode; cur += ch; i++; continue; }
      if (ch === '|' && !inCode) { cells.push(cur.trim()); cur = ''; i++; continue; }
      cur += ch; i++;
    }
    cells.push(cur.trim());
    return cells;
  }

  function parseTable(lines, start) {
    var head = splitRow(lines[start]);
    var align = splitRow(lines[start + 1]).map(function (c) {
      if (/^:-+:$/.test(c)) return 'center';
      if (/^:-+$/.test(c)) return 'left';
      if (/^-+:$/.test(c)) return 'right';
      return '';
    });

    var rows = [], i = start + 2;
    while (i < lines.length && /^\s*\S/.test(lines[i]) && lines[i].indexOf('|') !== -1 &&
           !/^\s*(```|~~~)/.test(lines[i])) {
      rows.push(splitRow(lines[i]));
      i++;
    }

    var html = '<div class="md-table-wrap"><table><thead><tr>';
    head.forEach(function (c, idx) {
      html += '<th' + (align[idx] ? ' style="text-align:' + align[idx] + '"' : '') + '>' +
              parseInline(c) + '</th>';
    });
    html += '</tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr>';
      for (var k = 0; k < head.length; k++) {
        html += '<td' + (align[k] ? ' style="text-align:' + align[k] + '"' : '') + '>' +
                parseInline(r[k] || '') + '</td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table></div>';

    return { html: html, next: i };
  }

  /* ---------------- 列表 ---------------- */

  function renderList(items) {
    if (!items || !items.length) return '';
    var base = items[0].indent;
    var tag = items[0].ordered ? 'ol' : 'ul';
    var html = '<' + tag + '>';
    var i = 0;

    while (i < items.length) {
      // 缩进更深的，交给递归
      if (items[i].indent > base) {
        var j = i;
        while (j < items.length && items[j].indent > base) j++;
        html += renderList(items.slice(i, j));
        i = j;
        continue;
      }

      var it = items[i];
      var k = i + 1;
      while (k < items.length && items[k].indent > base) k++;

      var box = '';
      var cls = '';
      if (it.checked !== undefined) {
        cls = ' class="md-task"';
        box = '<input type="checkbox" disabled' + (it.checked ? ' checked' : '') + '> ';
      }

      var inner = (k > i + 1) ? renderList(items.slice(i + 1, k)) : '';
      html += '<li' + cls + '>' + box +
              parseInline(it.text).replace(/\n/g, '<br>') + inner + '</li>';
      i = k;
    }

    html += '</' + tag + '>';
    return html;
  }

  var LI_RE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;

  function parseList(lines, start) {
    var items = [], i = start;

    while (i < lines.length) {
      var m = lines[i].match(LI_RE);
      if (!m) {
        // 允许列表项的缩进续行
        if (/^\s{2,}\S/.test(lines[i]) && items.length) {
          items[items.length - 1].text += '\n' + lines[i].trim();
          i++;
          continue;
        }
        break;
      }

      var indent = m[1].replace(/\t/g, '    ').length;
      var ordered = /\d/.test(m[2]);
      var text = m[3];
      var checked;

      var task = text.match(/^\[([ xX])\]\s+(.*)$/);
      if (task) {
        checked = task[1].toLowerCase() === 'x';
        text = task[2];
      }

      items.push({ indent: indent, ordered: ordered, text: text, checked: checked });
      i++;
    }

    return { html: renderList(items), next: i };
  }

  /* ---------------- 块级解析 ---------------- */

  var FENCE_RE = /^\s*(```|~~~)\s*([A-Za-z0-9+#._-]*)\s*$/;
  var HEADING_RE = /^(#{1,6})\s+(.*?)\s*#*\s*$/;
  var HR_RE = /^\s*([-*_])\s*(?:\1\s*){2,}$/;
  var QUOTE_RE = /^\s*>/;
  var TABLE_SEP_RE = /^\s*\|?[\s:\-|]+\|[\s:\-|]*$/;

  function parseBlocks(lines) {
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      if (/^\s*$/.test(line)) { i++; continue; }

      // 围栏代码块
      var fence = line.match(FENCE_RE);
      if (fence) {
        var mark = fence[1], lang = fence[2];
        var buf = [];
        i++;
        var closeRe = new RegExp('^\\s*' + mark + '\\s*$');
        while (i < lines.length && !closeRe.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code' + (lang ? ' class="lang-' + escapeHtml(lang) + '"' : '') + '>' +
                 escapeHtml(buf.join('\n')) + '</code></pre>');
        continue;
      }

      // 标题
      var h = line.match(HEADING_RE);
      if (h) {
        var lvl = h[1].length;
        out.push('<h' + lvl + ' id="' + slug(h[2]) + '">' + parseInline(h[2]) + '</h' + lvl + '>');
        i++;
        continue;
      }

      // 分割线
      if (HR_RE.test(line)) { out.push('<hr>'); i++; continue; }

      // 引用
      if (QUOTE_RE.test(line)) {
        var q = [];
        while (i < lines.length && QUOTE_RE.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, ''));
          i++;
        }
        out.push('<blockquote>' + parseBlocks(q) + '</blockquote>');
        continue;
      }

      // 表格
      if (line.indexOf('|') !== -1 && i + 1 < lines.length &&
          TABLE_SEP_RE.test(lines[i + 1]) && /-/.test(lines[i + 1])) {
        var tb = parseTable(lines, i);
        out.push(tb.html);
        i = tb.next;
        continue;
      }

      // 列表
      if (LI_RE.test(line)) {
        var ls = parseList(lines, i);
        out.push(ls.html);
        i = ls.next;
        continue;
      }

      // 段落
      var para = [];
      while (i < lines.length &&
             !/^\s*$/.test(lines[i]) &&
             !FENCE_RE.test(lines[i]) &&
             !HEADING_RE.test(lines[i]) &&
             !HR_RE.test(lines[i]) &&
             !QUOTE_RE.test(lines[i]) &&
             !LI_RE.test(lines[i])) {
        para.push(lines[i]);
        i++;
      }
      out.push('<p>' + parseInline(para.join('\n')).replace(/\n/g, '<br>') + '</p>');
    }

    return out.join('\n');
  }

  /* ---------------- 入口 ---------------- */

  function parse(md) {
    var text = String(md == null ? '' : md).replace(/\r\n?/g, '\n');
    return parseBlocks(text.split('\n'));
  }

  global.MiniMarkdown = {
    parse: parse,
    parseInline: parseInline,
    escapeHtml: escapeHtml,
    version: '1.0.0'
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* ==========================================================
   Markdown 编辑器 · 交互逻辑
   ========================================================== */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var editor = $('editor');
  var preview = $('preview');
  var docTitle = $('docTitle');
  var fileInput = $('fileInput');
  var dropMask = $('dropMask');
  var statChars = $('statChars');
  var statWords = $('statWords');
  var statLines = $('statLines');
  var statRead = $('statRead');
  var statSave = $('statSave');
  var workspace = $('workspace');
  var splitter = $('splitter');

  var STORE_KEY = 'md-studio:v1';

  /* ---------------- 示例文档 ---------------- */

  var SAMPLE = [
    '# 欢迎使用 Markdown 编辑器',
    '',
    '左侧输入，右侧**实时预览**。也可以把 `.md` 文件直接拖进窗口，或点击右上角「导入」。',
    '',
    '## 快捷操作',
    '',
    '- 点击工具栏按钮插入语法；再点一次可取消',
    '- `Ctrl / ⌘ + B` 粗体，`I` 斜体，`K` 链接',
    '- `Tab` 缩进两格，`Shift + Tab` 反缩进',
    '- 内容自动保存在浏览器本地，关掉页面也不会丢',
    '',
    '## 文本样式',
    '',
    '**粗体**、*斜体*、~~删除线~~、`行内代码`，以及 [超链接](https://www.markdownguide.org)。',
    '',
    '> 引用：先把想法写下来，再慢慢打磨。',
    '',
    '## 列表',
    '',
    '1. 有序列表第一项',
    '2. 第二项',
    '   - 嵌套的无序列表',
    '   - 再来一条',
    '',
    '- [x] 已经完成的待办',
    '- [ ] 还没开始的待办',
    '',
    '## 表格',
    '',
    '| 语法 | 写法 | 状态 |',
    '|:---|:---:|:---:|',
    '| 标题 | `#` 开头 | 支持 |',
    '| 表格 | 竖线分隔 | 支持 |',
    '| 代码块 | 三个反引号 | 支持 |',
    '',
    '## 代码',
    '',
    '```js',
    "function greet(name) {",
    "  console.log('你好，' + name);",
    '}',
    '```',
    '',
    '---',
    '',
    '现在试着改一改左边的内容吧。'
  ].join('\n');

  /* ---------------- 渲染 ---------------- */

  var renderTimer = null;

  function render() {
    var md = editor.value;
    var html = '';
    try {
      html = window.MiniMarkdown.parse(md);
    } catch (err) {
      html = '<p style="color:#e5484d">解析出错：' +
             window.MiniMarkdown.escapeHtml(String(err && err.message)) + '</p>';
    }
    preview.innerHTML = html || '<p class="md-empty">预览区是空的，在左侧写下第一行吧。</p>';
    updateStats(md);
  }

  function scheduleRender() {
    if (renderTimer) clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 80);
  }

  /* ---------------- 统计 ---------------- */

  function countWords(text) {
    var cjk = (text.match(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af]/g) || []).length;
    var latin = (text.replace(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af]/g, ' ')
      .match(/[A-Za-z0-9_'’-]+/g) || []).length;
    return cjk + latin;
  }

  function updateStats(text) {
    var chars = text.length;
    var lines = text ? text.split('\n').length : 0;
    var words = countWords(text);
    statChars.textContent = chars + ' 字符';
    statWords.textContent = words + ' 字';
    statLines.textContent = lines + ' 行';
    var minutes = Math.max(words ? 1 : 0, Math.round(words / 300));
    statRead.textContent = '约 ' + minutes + ' 分钟';
  }

  /* ---------------- 本地存储 ---------------- */

  var saveTimer = null;

  function save(immediate) {
    if (saveTimer) clearTimeout(saveTimer);
    var doSave = function () {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          doc: editor.value,
          title: docTitle.value,
          theme: document.documentElement.getAttribute('data-theme'),
          view: currentView
        }));
        statSave.textContent = '已保存';
        statSave.classList.add('ok');
        setTimeout(function () { statSave.classList.remove('ok'); }, 900);
      } catch (e) {
        statSave.textContent = '本地保存不可用';
      }
    };
    if (immediate) doSave();
    else {
      statSave.textContent = '编辑中…';
      saveTimer = setTimeout(doSave, 500);
    }
  }

  /* ---------------- 编辑器操作 ---------------- */

  function replaceRange(text, start, end, selectFrom, selectTo) {
    editor.focus();
    editor.setSelectionRange(start, end);
    var ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
    if (!ok) editor.setRangeText(text, start, end, 'end');
    if (selectFrom !== undefined) {
      editor.setSelectionRange(selectFrom, selectTo === undefined ? selectFrom : selectTo);
    }
    onEdit();
  }

  function wrap(before, after, placeholder) {
    var s = editor.selectionStart;
    var e = editor.selectionEnd;
    var sel = editor.value.slice(s, e);
    var isPlaceholder = false;
    if (!sel) { sel = placeholder || ''; isPlaceholder = true; }
    var text = before + sel + after;
    replaceRange(text, s, e, s + before.length, s + before.length + sel.length);
    if (isPlaceholder && placeholder) {
      // 选中占位文字，方便直接覆盖输入
      editor.setSelectionRange(s + before.length, s + before.length + sel.length);
    }
  }

  function lineRange() {
    var v = editor.value;
    var s = editor.selectionStart;
    var e = editor.selectionEnd;
    var ls = v.lastIndexOf('\n', s - 1) + 1;
    var le = v.indexOf('\n', e);
    if (le === -1) le = v.length;
    return [ls, le];
  }

  function eachLine(transform) {
    var r = lineRange();
    var block = editor.value.slice(r[0], r[1]);
    var lines = block.split('\n');
    var text = transform(lines).join('\n');
    replaceRange(text, r[0], r[1], r[0], r[0] + text.length);
  }

  function applyHeading(level) {
    var prefix = new Array(level + 1).join('#') + ' ';
    eachLine(function (lines) {
      var all = lines.every(function (l) {
        return l.trim() === '' || l.indexOf(prefix) === 0;
      });
      return lines.map(function (l) {
        var t = l.replace(/^\s*#{1,6}\s+/, '');
        if (l.trim() === '') return l;
        return all ? t : prefix + t;
      });
    });
  }

  function applyList(kind) {
    eachLine(function (lines) {
      var testRe, make, nonEmpty = lines.filter(function (l) { return l.trim() !== ''; });

      if (kind === 'ul') {
        testRe = /^\s*[-*+]\s+(?!\[[ xX]\])/;
        make = function () { return '- '; };
      } else if (kind === 'ol') {
        testRe = /^\s*\d+[.)]\s+/;
        make = function (i) { return (i + 1) + '. '; };
      } else if (kind === 'task') {
        testRe = /^\s*[-*+]\s+\[[ xX]\]\s+/;
        make = function () { return '- [ ] '; };
      } else {
        testRe = /^\s*>\s?/;
        make = function () { return '> '; };
      }

      var all = nonEmpty.length > 0 && nonEmpty.every(function (l) { return testRe.test(l); });

      return lines.map(function (l, i) {
        if (l.trim() === '') return l;
        var t = l.replace(testRe, '');
        return all ? t : make(i) + t;
      });
    });
  }

  function insertBlock(text) {
    var s = editor.selectionStart;
    var v = editor.value;
    var needBefore = s > 0 && v[s - 1] !== '\n';
    var prefix = needBefore ? '\n' : '';
    replaceRange(prefix + text, s, editor.selectionEnd,
      s + prefix.length, s + prefix.length + text.length);
  }

  var ACTIONS = {
    h1: function () { applyHeading(1); },
    h2: function () { applyHeading(2); },
    h3: function () { applyHeading(3); },
    bold: function () { wrap('**', '**', '粗体文字'); },
    italic: function () { wrap('*', '*', '斜体文字'); },
    strike: function () { wrap('~~', '~~', '删除线'); },
    code: function () { wrap('`', '`', 'code'); },
    ul: function () { applyList('ul'); },
    ol: function () { applyList('ol'); },
    task: function () { applyList('task'); },
    quote: function () { applyList('quote'); },
    link: function () { wrap('[', '](https://example.com)', '链接文字'); },
    image: function () { wrap('![', '](图片地址)', '图片描述'); },
    table: function () {
      insertBlock('| 列 1 | 列 2 | 列 3 |\n|:---|:---:|---:|\n| 内容 | 内容 | 内容 |\n');
    },
    codeblock: function () { insertBlock('```\n代码\n```\n'); },
    hr: function () { insertBlock('---\n'); },
    clear: function () {
      if (editor.value && !confirm('确定清空当前内容？此操作无法撤销。')) return;
      editor.value = '';
      onEdit();
    }
  };

  function onEdit() {
    scheduleRender();
    save(false);
  }

  /* ---------------- 工具栏 ---------------- */

  $('toolbar').addEventListener('mousedown', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    e.preventDefault(); // 保持 textarea 焦点
    var fn = ACTIONS[btn.getAttribute('data-act')];
    if (fn) fn();
  });

  editor.addEventListener('input', onEdit);

  editor.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey;

    if (mod && !e.altKey) {
      var k = e.key.toLowerCase();
      if (k === 'b') { e.preventDefault(); ACTIONS.bold(); return; }
      if (k === 'i') { e.preventDefault(); ACTIONS.italic(); return; }
      if (k === 'k') { e.preventDefault(); ACTIONS.link(); return; }
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      var s = editor.selectionStart, en = editor.selectionEnd;
      if (s !== en || e.shiftKey) {
        eachLine(function (lines) {
          return lines.map(function (l) {
            return e.shiftKey ? l.replace(/^ {1,2}/, '') : '  ' + l;
          });
        });
      } else {
        replaceRange('  ', s, en, s + 2);
      }
    }
  });

  /* ---------------- 滚动同步 ---------------- */

  var syncLock = false;

  function bindScroll(src, dst) {
    src.addEventListener('scroll', function () {
      if (syncLock) return;
      syncLock = true;
      var maxA = src.scrollHeight - src.clientHeight;
      var maxB = dst.scrollHeight - dst.clientHeight;
      if (maxA > 0 && maxB > 0) {
        dst.scrollTop = (src.scrollTop / maxA) * maxB;
      }
      requestAnimationFrame(function () { syncLock = false; });
    }, { passive: true });
  }

  bindScroll(editor, preview);
  bindScroll(preview, editor);

  /* ---------------- 导入 / 导出 ---------------- */

  function readFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result || '').replace(/\r\n?/g, '\n');
      editor.value = text;
      docTitle.value = file.name.replace(/\.(md|markdown|txt)$/i, '') || '未命名文档';
      render();
      save(true);
      editor.scrollTop = 0;
      preview.scrollTop = 0;
    };
    reader.onerror = function () { alert('读取文件失败，请重试。'); };
    reader.readAsText(file, 'utf-8');
  }

  $('btnImport').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    readFile(fileInput.files && fileInput.files[0]);
    fileInput.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (t) {
    window.addEventListener(t, function (e) {
      if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') === -1) return;
      e.preventDefault();
      dropMask.classList.add('show');
    });
  });

  ['dragleave', 'dragend'].forEach(function (t) {
    window.addEventListener(t, function (e) {
      if (e.relatedTarget) return;
      dropMask.classList.remove('show');
    });
  });

  window.addEventListener('drop', function (e) {
    e.preventDefault();
    dropMask.classList.remove('show');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    readFile(f);
  });

  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function baseName() {
    var t = (docTitle.value || '未命名文档').trim().replace(/[\\/:*?"<>|]/g, '_');
    return t || '未命名文档';
  }

  $('btnExportMd').addEventListener('click', function () {
    download(baseName() + '.md', editor.value, 'text/markdown');
  });

  function buildStandalone() {
    var css = document.getElementById('preview-style').textContent;
    var body = preview.innerHTML;
    var title = window.MiniMarkdown.escapeHtml(baseName());
    return [
      '<!DOCTYPE html>',
      '<html lang="zh-CN">',
      '<head>',
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<title>' + title + '</title>',
      '<style>',
      css,
      'body{margin:0;background:#ffffff;color:#1e2430;}',
      '.markdown-body{max-width:780px;margin:0 auto;padding:48px 24px 80px;}',
      '</style>',
      '</head>',
      '<body>',
      '<article class="markdown-body">',
      body,
      '</article>',
      '</body>',
      '</html>'
    ].join('\n');
  }

  $('btnExportHtml').addEventListener('click', function () {
    download(baseName() + '.html', buildStandalone(), 'text/html');
  });

  $('btnCopyHtml').addEventListener('click', function () {
    var btn = this;
    var html = buildStandalone();
    var done = function (ok) {
      var old = btn.textContent;
      btn.textContent = ok ? '已复制 ✓' : '复制失败';
      btn.classList.toggle('ok', ok);
      setTimeout(function () {
        btn.textContent = old;
        btn.classList.remove('ok');
      }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(html).then(function () { done(true); }, function () { done(false); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = html;
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
  });

  /* ---------------- 视图与主题 ---------------- */

  var currentView = 'split';

  function setView(view) {
    currentView = view;
    workspace.setAttribute('data-view', view);
    Array.prototype.forEach.call(document.querySelectorAll('#viewSeg button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-view') === view);
    });
    save(false);
  }

  $('viewSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-view]');
    if (b) setView(b.getAttribute('data-view'));
  });

  $('btnTheme').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    save(false);
  });

  docTitle.addEventListener('input', function () { save(false); });

  /* ---------------- 分栏拖拽 ---------------- */

  (function () {
    var dragging = false;
    splitter.addEventListener('mousedown', function (e) {
      dragging = true;
      e.preventDefault();
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });
    window.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      var rect = workspace.getBoundingClientRect();
      var ratio = (e.clientX - rect.left) / rect.width;
      ratio = Math.min(0.85, Math.max(0.15, ratio));
      var paneEdit = workspace.querySelector('.pane-edit');
      paneEdit.style.flex = '0 0 ' + (ratio * 100) + '%';
    });
    window.addEventListener('mouseup', function () {
      if (!dragging) return;
      dragging = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });
  })();

  /* ---------------- 启动 ---------------- */

  function boot() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { saved = null; }

    if (saved && typeof saved.doc === 'string' && saved.doc.length) {
      editor.value = saved.doc;
      docTitle.value = saved.title || '未命名文档';
      if (saved.theme) document.documentElement.setAttribute('data-theme', saved.theme);
      setView(saved.view === 'edit' || saved.view === 'preview' ? saved.view : 'split');
    } else {
      editor.value = SAMPLE;
      docTitle.value = '欢迎使用 Markdown 编辑器';
      setView('split');
    }

    if (window.innerWidth < 760) setView('edit');

    render();
    statSave.textContent = '已就绪';
  }

  boot();
})();
</script>
</body>
</html>
